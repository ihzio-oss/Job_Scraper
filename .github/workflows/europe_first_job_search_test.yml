name: Europe-first Job Search Test

on:
  push:
    paths:
      - ".github/workflows/europe_first_job_search_test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Search Europe-first Indeed roles
        run: python scrape_jobs.py --indeed-only
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_MIN_FIT: ${{ vars.NOTIFY_MIN_FIT }}
      - name: Show matched roles
        run: |
          python - <<'PY'
          import json
          with open("output/indeed_jobs.json", encoding="utf-8") as f:
              data = json.load(f)
          print(f"Matched: {data.get('total', 0)} | New: {data.get('new_count', 0)}")
          for job in data.get("jobs", [])[:15]:
              print(f"- {job.get('title')} | {job.get('company')} | {job.get('location')}")
          PY
