name: Send Latest Job Demo

on:
  push:
    paths:
      - ".github/workflows/send_latest_job_demo.yml"

jobs:
  send-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send latest Indeed match to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          if not token or not chat_id:
              print("Telegram secrets are missing.")
              sys.exit(1)

          with open("output/indeed_jobs.json", encoding="utf-8") as f:
              jobs = json.load(f).get("jobs", [])
          if not jobs:
              print("No Indeed job available for demo.")
              sys.exit(1)

          job = jobs[0]
          text = (
              "🌍 Job Finder Esra — demo ilan\n"
              f"{job.get('title', 'Yeni ilan')}\n"
              f"{job.get('company', '?')} — {job.get('location', '')}\n"
              "uyum 64/100\n\n"
              f"🔗 {job.get('url', '')}"
          )
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=json.dumps({
                  "chat_id": chat_id,
                  "text": text,
                  "disable_web_page_preview": True,
              }).encode("utf-8"),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              if not (200 <= response.status < 300):
                  sys.exit(1)
          print("Demo job sent.")
          PY
